<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Strikers Białystok - Centrum Meczowe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#0b0f19',
            brandAccent: '#f59e0b',
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- NAWIGACJA -->
  <nav class="fixed top-0 left-0 w-full z-50 glass-panel border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="font-black text-xl text-white tracking-wider">SUPER <span class="text-brandAccent">STRIKERS</span></span>
      </div>
      <button onclick="toggleAdminPanel()" class="bg-brandAccent/20 hover:bg-brandAccent/30 text-brandAccent border border-brandAccent/40 px-4 py-2 rounded-xl text-xs font-bold uppercase transition">
        <i class="fas fa-cog mr-1.5"></i> Panel Zarządzania
      </button>
    </div>
  </nav>

  <!-- CENTRUM MECZOWE -->
  <header id="centrum-meczowe" class="relative pt-28 pb-16 overflow-hidden">
    <div class="max-w-6xl mx-auto px-4">
      
      <div class="text-center mb-6">
        <h1 class="text-3xl sm:text-5xl font-black uppercase tracking-tight">
          Centrum <span class="text-brandAccent">Meczowe</span>
        </h1>
      </div>

      <div class="glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden">
        
        <!-- TYP MECZU (LIGA / TOWARZYSKI) -->
        <div class="text-center mb-8">
          <span id="display-match-type" class="inline-block bg-brandAccent/10 border border-brandAccent/40 text-brandAccent text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm">
            MECZ TOWARZYSKI
          </span>
        </div>

        <div class="grid grid-cols-3 items-start text-center gap-2 sm:gap-6">
          
          <!-- GOSPODARZ -->
          <div class="flex flex-col items-center">
            <div class="w-16 h-16 sm:w-24 sm:h-24 glass-card rounded-2xl flex items-center justify-center p-3 mb-3 shadow-inner">
              <i class="fas fa-shield-halved text-3xl sm:text-5xl text-brandAccent"></i>
            </div>
            <h2 id="display-home-team" class="font-black text-base sm:text-2xl text-white uppercase tracking-wide">SUPER STRIKERS</h2>
            <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-2">Gospodarz</span>
            
            <!-- STRZELCY GOSPODARZY POD NAZWĄ KLUBU -->
            <div id="display-home-scorers" class="text-xs text-slate-300 space-y-1 font-medium mt-1">
              <!-- Wstawiane dynamicznie przez JS -->
            </div>
          </div>

          <!-- WYNIK / WADOMOŚĆ -->
          <div class="flex flex-col items-center pt-2">
            <div id="display-score" class="text-2xl sm:text-5xl font-black text-white bg-white/10 px-4 sm:px-6 py-2 rounded-2xl border border-white/20 mb-3 shadow-lg tracking-widest">
              3 : 1
            </div>
            <span id="display-status" class="text-[10px] sm:text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full uppercase mb-2">
              Koniec Meczu
            </span>
            <div id="display-time" class="text-xs text-slate-400 font-medium">Sobota, 18:00</div>
          </div>

          <!-- GOŚĆ -->
          <div class="flex flex-col items-center">
            <div class="w-16 h-16 sm:w-24 sm:h-24 glass-card rounded-2xl flex items-center justify-center p-3 mb-3 text-2xl font-black text-slate-400">
              <i class="fas fa-shield text-3xl sm:text-5xl text-slate-400"></i>
            </div>
            <h2 id="display-away-team" class="font-black text-base sm:text-2xl text-white uppercase tracking-wide">RIVAL FC</h2>
            <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider mb-2">Gość</span>
            
            <!-- STRZELCY GOŚCI POD NAZWĄ KLUBU -->
            <div id="display-away-scorers" class="text-xs text-slate-300 space-y-1 font-medium mt-1">
              <!-- Wstawiane dynamicznie przez JS -->
            </div>
          </div>

        </div>

        <!-- DOLNY PASEK INFORMACYJNY -->
        <div class="mt-8 pt-4 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2 text-center sm:text-left">
          <div><i class="fas fa-map-marker-alt text-brandAccent mr-1.5"></i> <span id="display-venue">Stadion Miejski, Białystok</span></div>
          <div><i class="fas fa-whistle text-brandAccent mr-1.5"></i> <span id="display-referee">Sędzia: A. Nowak</span></div>
        </div>

      </div>
    </div>
  </header>

  <!-- PANEL ZARZĄDZANIA (MODAL/PANEL ADMINA) -->
  <div id="admin-panel" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-2xl rounded-3xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
        <h3 class="text-xl font-bold text-white"><i class="fas fa-edit text-brandAccent mr-2"></i>Edycja Centrum Meczowego</h3>
        <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
      </div>

      <form id="match-center-form" onsubmit="saveMatchData(event)" class="space-y-4">
        
        <!-- TYP MECZU -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Typ Meczu</label>
          <select id="input-match-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent">
            <option value="Mecz Towarzyski">Mecz Towarzyski</option>
            <option value="Mecz Ligowy - Kolejka 1">Mecz Ligowy - Kolejka 1</option>
            <option value="Mecz Ligowy - Kolejka 2">Mecz Ligowy - Kolejka 2</option>
            <option value="Mecz Ligowy">Mecz Ligowy</option>
            <option value="Puchar Polski">Puchar Polski</option>
          </select>
        </div>

        <!-- NAZWY DRUŻYN I WYNIK -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Gospodarz</label>
            <input type="text" id="input-home-team" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Wynik</label>
            <input type="text" id="input-score" placeholder="np. 3 : 1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Gość</label>
            <input type="text" id="input-away-team" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent" required>
          </div>
        </div>

        <!-- STRZELCY BRAMEK -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Strzelcy Gospodarzy (po przecinku)</label>
            <textarea id="input-home-scorers" rows="2" placeholder="np. Kowalski 14', Szymański 45'" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Strzelcy Gości (po przecinku)</label>
            <textarea id="input-away-scorers" rows="2" placeholder="np. Nowak 60'" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent"></textarea>
          </div>
        </div>

        <!-- STATUS, DATA, STADION, SĘDZIA -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Status Meczu</label>
            <input type="text" id="input-status" placeholder="np. Koniec Meczu / 1. Połowa" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Data / Godzina</label>
            <input type="text" id="input-time" placeholder="np. Sobota, 18:00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Stadion</label>
            <input type="text" id="input-venue" placeholder="np. Stadion Miejski, Białystok" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Sędzia</label>
            <input type="text" id="input-referee" placeholder="np. A. Nowak" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brandAccent">
          </div>
        </div>

        <!-- PRZYCISKI -->
        <div class="flex justify-end space-x-3 pt-4 border-t border-white/10">
          <button type="button" onclick="toggleAdminPanel()" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase text-slate-400 hover:bg-white/5">Anuluj</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase bg-brandAccent text-slate-950 hover:bg-amber-400 transition">Zapisz Zmiany</button>
        </div>

      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="py-6 border-t border-white/10 text-center text-xs text-slate-500">
    &copy; Super Strikers Białystok. Wszystkie prawa zastrzeżone.
  </footer>

  <!-- SKRYPT LOGIKI -->
  <script>
    // Domyślne dane meczu
    const defaultMatchData = {
      matchType: "Mecz Towarzyski",
      homeTeam: "SUPER STRIKERS",
      awayTeam: "RIVAL FC",
      score: "3 : 1",
      status: "Koniec Meczu",
      time: "Sobota, 18:00",
      venue: "Stadion Miejski, Białystok",
      referee: "A. Nowak",
      homeScorers: ["Kowalski 14'", "Szymański 45'"],
      awayScorers: ["Nowak 60'"]
    };

    // Pobieranie danych z LocalStorage
    function getMatchData() {
      const saved = localStorage.getItem('match_center_data');
      return saved ? JSON.parse(saved) : defaultMatchData;
    }

    // Renderowanie widoku Centrum Meczowego
    function renderMatchCenter() {
      const data = getMatchData();

      document.getElementById('display-match-type').innerText = data.matchType;
      document.getElementById('display-home-team').innerText = data.homeTeam;
      document.getElementById('display-away-team').innerText = data.awayTeam;
      document.getElementById('display-score').innerText = data.score;
      document.getElementById('display-status').innerText = data.status;
      document.getElementById('display-time').innerText = data.time;
      document.getElementById('display-venue').innerText = data.venue;
      document.getElementById('display-referee').innerText = `Sędzia: ${data.referee}`;

      // Renderowanie strzelców pod nazwami drużyn
      const homeScorersEl = document.getElementById('display-home-scorers');
      homeScorersEl.innerHTML = (data.homeScorers || []).map(scorer => 
        `<div><i class="fas fa-futbol text-brandAccent mr-1"></i> ${scorer.trim()}</div>`
      ).join('');

      const awayScorersEl = document.getElementById('display-away-scorers');
      awayScorersEl.innerHTML = (data.awayScorers || []).map(scorer => 
        `<div><i class="fas fa-futbol text-slate-400 mr-1"></i> ${scorer.trim()}</div>`
      ).join('');
    }

    // Otwieranie / Zamykanie panelu admina
    function toggleAdminPanel() {
      const panel = document.getElementById('admin-panel');
      panel.classList.toggle('hidden');

      if (!panel.classList.contains('hidden')) {
        const data = getMatchData();
        document.getElementById('input-match-type').value = data.matchType;
        document.getElementById('input-home-team').value = data.homeTeam;
        document.getElementById('input-away-team').value = data.awayTeam;
        document.getElementById('input-score').value = data.score;
        document.getElementById('input-status').value = data.status;
        document.getElementById('input-time').value = data.time;
        document.getElementById('input-venue').value = data.venue;
        document.getElementById('input-referee').value = data.referee;
        document.getElementById('input-home-scorers').value = (data.homeScorers || []).join(', ');
        document.getElementById('input-away-scorers').value = (data.awayScorers || []).join(', ');
      }
    }

    // Zapisywanie danych z formularza
    function saveMatchData(event) {
      event.preventDefault();

      const homeScorersInput = document.getElementById('input-home-scorers').value;
      const awayScorersInput = document.getElementById('input-away-scorers').value;

      const updatedData = {
        matchType: document.getElementById('input-match-type').value,
        homeTeam: document.getElementById('input-home-team').value,
        awayTeam: document.getElementById('input-away-team').value,
        score: document.getElementById('input-score').value,
        status: document.getElementById('input-status').value,
        time: document.getElementById('input-time').value,
        venue: document.getElementById('input-venue').value,
        referee: document.getElementById('input-referee').value,
        homeScorers: homeScorersInput ? homeScorersInput.split(',').map(s => s.trim()).filter(Boolean) : [],
        awayScorers: awayScorersInput ? awayScorersInput.split(',').map(s => s.trim()).filter(Boolean) : []
      };

      localStorage.setItem('match_center_data', JSON.stringify(updatedData));
      renderMatchCenter();
      toggleAdminPanel();
    }

    // Inicjalizacja przy załadowaniu strony
    document.addEventListener('DOMContentLoaded', renderMatchCenter);
  </script>
</body>
</html>
