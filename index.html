<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klub Sportowy - Match Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --rm-radius: 24px;
      --rm-btn-radius: 12px;
      --red-accent: #e11d48;
      --red-hover: #f43f5e;
      --dark-card: rgba(18, 18, 22, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(20, 10, 15, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #4c0519 0%, #110206 40%, #050102 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* SZKLANA WYSPA NAWIGACYJNA */
    .nav-wrapper {
      position: sticky;
      top: 20px;
      z-index: 1000;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 12px 28px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 30px rgba(225, 29, 72, 0.12);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.03);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-menu a {
      text-decoration: none;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .nav-menu a:hover {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    /* MATCH CENTER (GŁÓWNY MODUŁ) */
    .match-center-container {
      max-width: 1360px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 22px;
      background: var(--red-accent);
      border-radius: 2px;
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    .match-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.3s ease;
    }

    .match-card:hover {
      border-color: rgba(225, 29, 72, 0.4);
    }

    .match-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 30px 0;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 40%;
      text-align: center;
    }

    .team-badge {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .team-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--red-accent);
      letter-spacing: 2px;
    }

    .match-footer {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }

    /* TABELA LIGOWA */
    .table-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-top: 16px;
    }

    .mini-table th {
      text-align: left;
      color: #94a3b8;
      padding-bottom: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--glass-border);
    }

    .mini-table td {
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mini-table tr.active-team td {
      font-weight: 800;
      color: var(--red-hover);
    }

    @media (max-width: 900px) {
      .nav-menu { display: none; }
      .match-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SZKLANA WYSPA NAWIGACYJNA -->
  <div class="nav-wrapper">
    <header>
      <div class="nav-container">
        
        <a href="#">
          <img src="eff436a8-5c9e-444b-87d3-8f0ddc3e3028-removebg-preview.png" alt="Logo Klubu" class="logo-img">
        </a>

        <ul class="nav-menu">
          <li><a href="#">Klub</a></li>
          <li><a href="#">Drużyna</a></li>
          <li><a href="#">Match Center</a></li>
          <li><a href="#">Tabela</a></li>
          <li><a href="#">Kontakt</a></li>
        </ul>

      </div>
    </header>
  </div>

  <!-- MATCH CENTER + TABELA -->
  <section class="match-center-container">
    <h2 class="section-title">Match Center</h2>
    
    <div class="match-grid">
      
      <!-- MECZ -->
      <div class="match-card" id="match-node">
        <div class="match-header">
          <span>Ostatni Mecz</span>
          <span>Liga</span>
        </div>
        <div class="match-teams">
          <div class="team">
            <div class="team-badge">Nasz</div>
            <span class="team-name">Gospodarze</span>
          </div>
          <div class="score">3 : 1</div>
          <div class="team">
            <div class="team-badge">GOS</div>
            <span class="team-name">Rywale</span>
          </div>
        </div>
        <div class="match-footer">Sobota, 10 Maja • Stadion Miejski</div>
      </div>

      <!-- TABELA LIGOWA -->
      <div class="table-card" id="league-table-node">
        <div class="match-header">
          <span>Tabela Ligowa</span>
          <span>Pozycja</span>
        </div>
        <table class="mini-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Klub</th>
              <th>M</th>
              <th>Pkt</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Lider Ligi</td>
              <td>10</td>
              <td>25</td>
            </tr>
            <tr class="active-team">
              <td>2</td>
              <td>Nasz Klub</td>
              <td>10</td>
              <td>22</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Rywal 2</td>
              <td>10</td>
              <td>18</td>
            </tr>
            <tr>
              <td>4</td>
              <td>Rywal 3</td>
              <td>10</td>
              <td>14</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </section>

</body>
</html>
