<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klub Sportowy - Match Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --rm-radius: 24px;
      --rm-btn-radius: 12px;
      --red-accent: #e11d48;
      --red-hover: #f43f5e;
      --dark-card: rgba(18, 18, 22, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(20, 10, 15, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #4c0519 0%, #110206 40%, #050102 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* SZKLANA WYSPA NAWIGACYJNA Z CHOWANIEM */
    .nav-wrapper {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 1000;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 20px;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .nav-wrapper.nav-hidden {
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
    }

    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 12px 28px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 30px rgba(225, 29, 72, 0.12);
    }

    .nav-container {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }

    .logo-link {
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.03);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      list-style: none;
    }

    .nav-menu a {
      text-decoration: none;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .nav-menu a:hover {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .nav-spacer {
      width: 52px;
    }

    /* TYTUŁY SEKCJI */
    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 22px;
      background: var(--red-accent);
      border-radius: 2px;
    }

    /* KONTENER GŁÓWNY Z MARGINESEM NA WYSPĘ */
    .main-wrapper {
      padding-top: 100px;
      padding-bottom: 80px;
    }

    /* MATCH CENTER */
    .match-center-container {
      max-width: 1360px;
      margin: 40px auto;
      padding: 0 20px;
      scroll-margin-top: 120px;
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    .match-list-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .match-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.3s ease;
    }

    .match-card:hover {
      border-color: rgba(225, 29, 72, 0.4);
    }

    .match-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .match-header span:last-child {
      text-align: right;
    }

    .match-type-tag {
      background: rgba(225, 29, 72, 0.15);
      color: var(--red-hover);
      border: 1px solid rgba(225, 29, 72, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      justify-self: center;
    }

    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 30px 0 15px 0;
    }

    .team {
      width: 38%;
      text-align: center;
    }

    .team-name {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .score {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--red-accent);
      letter-spacing: 2px;
    }

    .cancelled-tag {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.1);
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .match-scorers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
    }

    .scorers-home { text-align: left; }
    .scorers-away { text-align: right; }

    .match-footer {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }

    /* TABELA LIGOWA */
    .table-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      height: fit-content;
    }

    .table-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-top: 16px;
    }

    .mini-table th {
      text-align: left;
      color: #94a3b8;
      padding-bottom: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--glass-border);
    }

    .mini-table td {
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mini-table tr.active-team td {
      font-weight: 800;
      color: var(--red-hover);
    }

    /* KONTENER SEKCJI */
    .content-container {
      max-width: 1360px;
      margin: 60px auto;
      padding: 0 20px;
      scroll-margin-top: 120px;
    }

    /* AKTUALNOŚCI */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .news-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(225, 29, 72, 0.4);
      box-shadow: 0 12px 30px rgba(225, 29, 72, 0.15);
    }

    .news-date {
      font-size: 0.75rem;
      color: var(--red-hover);
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .news-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .news-excerpt {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* SEKCJA DRUŻYNA */
    .squad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .player-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .player-card:hover {
      transform: translateY(-4px);
      border-color: rgba(225, 29, 72, 0.4);
    }

    .player-number {
      position: absolute;
      top: -10px;
      right: 15px;
      font-size: 3.5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.05);
      user-select: none;
    }

    .player-position {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--red-hover);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .player-name {
      font-size: 1.1rem;
      font-weight: 800;
    }

    /* OKNO MODALNE (POP-UP Z ARTYKUŁEM) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: rgba(20, 10, 15, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      width: 90%;
      max-width: 680px;
      padding: 36px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px rgba(225, 29, 72, 0.2);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-container {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #ffffff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--red-accent);
    }

    .modal-date {
      font-size: 0.8rem;
      color: var(--red-hover);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .modal-body {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .nav-container { display: flex; justify-content: space-between; }
      .nav-menu, .nav-spacer { display: none; }
      .match-grid, .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SZKLANA WYSPA NAWIGACYJNA -->
  <div class="nav-wrapper" id="navIsland">
    <header>
      <div class="nav-container">
        <a href="#" class="logo-link">
          <img src="eff436a8-5c9e-444b-87d3-8f0ddc3e3028-removebg-preview.png" alt="Logo Klubu" class="logo-img">
        </a>
        <ul class="nav-menu">
          <li><a href="#match-center">Match Center</a></li>
          <li><a href="#tabela">Tabela</a></li>
          <li><a href="#aktualnosci">Aktualności</a></li>
          <li><a href="#druzyna">Drużyna</a></li>
        </ul>
        <div class="nav-spacer"></div>
      </div>
    </header>
  </div>

  <div class="main-wrapper">
    
    <!-- MATCH CENTER + TABELA -->
    <section class="match-center-container" id="match-center">
      <h2 class="section-title">Match Center</h2>
      <div class="match-grid">
        
        <!-- MECZE LISTA -->
        <div class="match-list-container" id="match-center-list"></div>

        <!-- TABELA LIGOWA -->
        <div class="table-card" id="tabela">
          <div class="table-header">
            <span>Tabela Ligowa</span>
            <span>Pozycja</span>
          </div>
          <table class="mini-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Klub</th>
                <th>M</th>
                <th>Bramki</th>
                <th>Pkt</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

      </div>
    </section>

    <!-- AKTUALNOŚCI KLUBOWE -->
    <div class="content-container" id="aktualnosci">
      <h2 class="section-title">Aktualności</h2>
      <div class="news-grid" id="news-grid"></div>
    </div>

    <!-- DRUŻYNA -->
    <div class="content-container" id="druzyna">
      <h2 class="section-title">Drużyna</h2>
      <div class="squad-grid" id="squad-grid"></div>
    </div>

  </div>

  <!-- OKNO MODALNE (POP-UP) -->
  <div class="modal-overlay" id="articleModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-container">
      <button class="modal-close" onclick="closeArticle()">&times;</button>
      <div class="modal-date" id="modalDate">Data</div>
      <h2 class="modal-title" id="modalTitle">Tytuł Artykułu</h2>
      <div class="modal-body" id="modalBody">
        Treść artykułu...
      </div>
    </div>
  </div>

  <script>
    // Baza danych artykułów potrzebna do wywołania modala
    let currentArticles = [];

    function renderPage() {
      renderMatchCenter();
      renderTable();
      renderNews();
      renderSquad();
    }

    // 1. MATCH CENTER
    function renderMatchCenter() {
      const defaultMatches = [{
        id: 1, type: "Mecz Towarzyski", leagueName: "Sparing Przedsezonowy", isCancelled: false,
        home: "Gospodarze", away: "Rywale", scoreHome: 3, scoreAway: 1,
        date: "Sobota, 10 Maja", status: "Zakończony", location: "Stadion Miejski",
        homeScorers: [], awayScorers: []
      }];

      const matches = JSON.parse(localStorage.getItem('matchCenterList')) || defaultMatches;
      const container = document.getElementById('match-center-list');

      if (!matches || matches.length === 0) {
        container.innerHTML = `<div class="match-card"><p style="text-align:center; color:#94a3b8;">Brak zaplanowanych spotkań.</p></div>`;
        return;
      }

      container.innerHTML = matches.map(m => {
        const homeScorersTxt = (m.homeScorers && m.homeScorers.length > 0) ? m.homeScorers.join(', ') : '';
        const awayScorersTxt = (m.awayScorers && m.awayScorers.length > 0) ? m.awayScorers.join(', ') : '';
        const hasScorers = homeScorersTxt || awayScorersTxt;

        return `
          <div class="match-card">
            <div class="match-header">
              <span>${m.leagueName || 'Rozgrywki'}</span>
              <span class="match-type-tag">${m.type || 'Mecz'}</span>
              <span>${m.status || 'Zapowiedź'}</span>
            </div>
            <div class="match-teams">
              <div class="team">
                <span class="team-name">${m.home}</span>
              </div>
              ${m.isCancelled 
                ? `<div class="cancelled-tag">ODWOŁANY</div>` 
                : `<div class="score">${m.scoreHome} : ${m.scoreAway}</div>`
              }
              <div class="team">
                <span class="team-name">${m.away}</span>
              </div>
            </div>

            ${(!m.isCancelled && hasScorers) ? `
              <div class="match-scorers">
                <div class="scorers-home">${homeScorersTxt}</div>
                <div class="scorers-away">${awayScorersTxt}</div>
              </div>
            ` : ''}

            <div class="match-footer">${m.date}${m.location ? ' • ' + m.location : ''}</div>
          </div>
        `;
      }).join('');
    }

    // 2. TABELA LIGOWA
    function renderTable() {
      const defaultTable = [
        { id: 1, name: "Lider Ligi", isUser: false, m: 10, gf: 20, ga: 5, pkt: 25 },
        { id: 2, name: "Nasz Klub", isUser: true, m: 10, gf: 18, ga: 8, pkt: 22 },
        { id: 3, name: "Rywal 2", isUser: false, m: 10, gf: 14, ga: 10, pkt: 18 },
        { id: 4, name: "Rywal 3", isUser: false, m: 10, gf: 10, ga: 15, pkt: 14 }
      ];

      const tableData = JSON.parse(localStorage.getItem('tableData')) || defaultTable;
      const tbody = document.getElementById('table-body');

      tbody.innerHTML = tableData.map((t, index) => `
        <tr class="${t.isUser ? 'active-team' : ''}">
          <td>${index + 1}</td>
          <td>${t.name}</td>
          <td>${t.m}</td>
          <td>${t.gf !== undefined ? t.gf + ':' + t.ga : '-'}</td>
          <td>${t.pkt}</td>
        </tr>
      `).join('');
    }

    // 3. AKTUALNOŚCI
    function renderNews() {
      const defaultNews = [
        { id: 1, title: "Podsumowanie wygranego spotkania domowego", date: "12 Maja 2026", category: "Raport Meczowy", content: "Znakomity występ naszej drużyny i ważne punkty zdobyte przed własną publicznością. Od pierwszych minut kontrolowaliśmy przebieg spotkania, co przełożyło się na pewne zwycięstwo 3:1." },
        { id: 2, title: "Przygotowania do kolejki ligowej", date: "08 Maja 2026", category: "Trening", content: "Zespół intensywnie trenuje przed nadchodzącym wyjazdowym starciem. Trenerzy skupiają się na poprawie skuteczności w stałych fragmentach gry." },
        { id: 3, title: "Komunikat Zarządu Klubu", date: "01 Maja 2026", category: "Klub", content: "Ważne informacje organizacyjne dotyczące nadchodzących wydarzeń sportowych oraz planowanych treningów." }
      ];

      currentArticles = JSON.parse(localStorage.getItem('articles')) || defaultNews;
      const container = document.getElementById('news-grid');

      container.innerHTML = currentArticles.map((a, index) => {
        const plainText = a.content ? a.content.replace(/<[^>]*>?/gm, '') : '';
        const excerpt = plainText.length > 90 ? plainText.substring(0, 90) + '...' : plainText;

        return `
          <div class="news-card" onclick="openArticleByIndex(${index})">
            <div>
              <div class="news-date">${a.date}${a.category ? ' • ' + a.category : ''}</div>
              <h3 class="news-title">${a.title}</h3>
              <p class="news-excerpt">${excerpt}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. KADRA DRUŻYNY
    function renderSquad() {
      const defaultSquad = [
        { id: 1, num: 1, name: "Jan Kowalski", pos: "Bramkarz" },
        { id: 2, num: 4, name: "Michał Nowak", pos: "Obrońca" },
        { id: 3, num: 8, name: "Piotr Wiśniewski", pos: "Pomocnik" },
        { id: 4, num: 10, name: "Kamil Wójcik", pos: "Napastnik" }
      ];

      const squad = JSON.parse(localStorage.getItem('squad')) || defaultSquad;
      const container = document.getElementById('squad-grid');

      container.innerHTML = squad.map(p => `
        <div class="player-card">
          ${p.num ? `<div class="player-number">${p.num}</div>` : ''}
          <div class="player-position">${p.pos}</div>
          <div class="player-name">${p.name}</div>
        </div>
      `).join('');
    }

    /* OBSŁUGA OKNA MODALNEGO ARTYKUŁÓW */
    function openArticleByIndex(index) {
      const article = currentArticles[index];
      if (!article) return;

      document.getElementById('modalDate').innerText = article.date + (article.category ? ' • ' + article.category : '');
      document.getElementById('modalTitle').innerText = article.title;
      document.getElementById('modalBody').innerHTML = article.content;
      document.getElementById('articleModal').classList.add('active');
    }

    function closeArticle() {
      document.getElementById('articleModal').classList.remove('active');
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === 'articleModal') {
        closeArticle();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeArticle();
      }
    });

    /* AUTOHIDE NAWIGACJI PRZY SKROLOWANIU */
    let lastScrollY = window.scrollY;
    const navIsland = document.getElementById('navIsland');

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY && currentScrollY > 100) {
        navIsland.classList.add('nav-hidden');
      } else {
        navIsland.classList.remove('nav-hidden');
      }

      lastScrollY = currentScrollY;
    });

    // Wczytanie danych ze schowka po załadowaniu drzewa DOM
    document.addEventListener('DOMContentLoaded', renderPage);
  </script>

</body>
</html>
