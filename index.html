<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klub Sportowy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --rm-radius: 24px;
      --rm-btn-radius: 12px;
      --red-accent: #e11d48;
      --red-hover: #f43f5e;
      --dark-card: rgba(18, 18, 22, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(20, 10, 15, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Czerwono-czarny gradient w tle */
      background: radial-gradient(circle at 50% 0%, #4c0519 0%, #110206 40%, #050102 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* MENU WYSPA (FLOATING GLASS ISLAND NAV) */
    .nav-wrapper {
      position: sticky;
      top: 20px;
      z-index: 1000;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid rgba(255, 255, 255, 0.25); /* Podświetlenie górnej krawędzi szkła */
      border-radius: 24px;
      padding: 12px 28px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 30px rgba(225, 29, 72, 0.12);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo przesunięte maksymalnie do lewej */
    .logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.03);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-menu a {
      text-decoration: none;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .nav-menu a:hover {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* PRZYCISKI KLUBOWE */
    .btn-primary {
      background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 22px;
      border-radius: var(--rm-btn-radius);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.35);
      text-decoration: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(225, 29, 72, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid var(--glass-border);
      padding: 10px 20px;
      border-radius: var(--rm-btn-radius);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* HERO BANNER */
    .hero-container {
      max-width: 1360px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .hero-card {
      background: var(--dark-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--rm-radius);
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      overflow: hidden;
      min-height: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-text-box {
      padding: 60px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .hero-title {
      color: #ffffff;
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    /* CARDS GRID BELOW HERO */
    .grid-container {
      max-width: 1360px;
      margin: 24px auto 60px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .mini-card {
      border-radius: var(--rm-radius);
      overflow: hidden;
      height: 220px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .mini-card:hover {
      transform: translateY(-6px);
      border-color: rgba(225, 29, 72, 0.5);
      box-shadow: 0 15px 35px rgba(225, 29, 72, 0.2);
    }

    .mini-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 1024px) {
      .hero-card { grid-template-columns: 1fr; }
      .nav-menu { display: none; }
      .grid-container { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- SZKLANA WYSPA NAWIGACYJNA -->
  <div class="nav-wrapper">
    <header>
      <div class="nav-container">
        
        <!-- LOGO MAKSYMALNIE PO LEWEJ BEZ IKONY PRED NIM -->
        <a href="#">
          <img src="eff436a8-5c9e-444b-87d3-8f0ddc3e3028-removebg-preview.png" alt="Logo Klubu" class="logo-img">
        </a>

        <!-- MENU DLA KLUBU AMATORSKIEGO -->
        <ul class="nav-menu">
          <li><a href="#">Klub</a></li>
          <li><a href="#">Drużyna</a></li>
          <li><a href="#">Terminarz</a></li>
          <li><a href="#">Tabela</a></li>
          <li><a href="#">Kontakt</a></li>
        </ul>

        <!-- PRZYCISKI AKCJI KLUBU AMATORSKIEGO -->
        <div class="nav-right">
          <a href="#" class="btn-secondary">Wesprzyj klub</a>
          <a href="#" class="btn-primary">
            Dołącz do nas
          </a>
        </div>
      </div>
    </header>
  </div>

  <!-- MAIN HERO BANNER -->
  <main class="hero-container">
    <div class="hero-card">
      <img src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=1200&q=80" alt="Prezentacja" class="hero-image">
      <div class="hero-text-box">
        <h1 class="hero-title">Rozpoczynamy przygotowania do nowego sezonu!</h1>
        <div>
          <a href="#" class="btn-primary" style="display: inline-flex;">Sprawdź terminarz</a>
        </div>
      </div>
    </div>
  </main>

  <!-- CARDS GRID -->
  <section class="grid-container">
    <div class="mini-card">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=500&q=80" alt="Mecz">
    </div>
    <div class="mini-card">
      <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=500&q=80" alt="Stadion">
    </div>
    <div class="mini-card">
      <img src="https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?auto=format&fit=crop&w=500&q=80" alt="Trening">
    </div>
    <div class="mini-card">
      <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=500&q=80" alt="Galeria">
    </div>
  </section>

</body>
</html>
