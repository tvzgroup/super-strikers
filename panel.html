<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administratora - Super Strikers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#08080a',
            brandRed: '#dc2626',
            brandRedDark: '#991b1b',
            glassDark: 'rgba(15, 15, 20, 0.75)'
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(220, 38, 38, 0.05) 100%), rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(220, 38, 38, 0.5);
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans pb-12 selection:bg-brandRed selection:text-white">

  <!-- NAGŁÓWEK PANELU -->
  <header class="glass-panel border-b border-red-500/20 sticky top-0 z-30 mb-8">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-brandRed text-white p-2 rounded-xl">
          <i class="fas fa-sliders-h text-lg"></i>
        </div>
        <h1 class="font-black text-lg sm:text-xl uppercase tracking-wider">
          Panel <span class="text-brandRed">Zarządzania</span>
        </h1>
      </div>
      <div class="flex items-center space-x-3">
        <a href="index.html" target="_blank" class="bg-white/10 hover:bg-white/20 text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2">
          <i class="fas fa-external-link-alt text-brandRed"></i> Zobacz stronę
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-2 gap-8">

    <!-- CENTRUM MECZOWE -->
    <section class="glass-panel rounded-3xl p-6 border border-red-500/20 lg:col-span-2">
      <div class="flex items-center justify-between mb-6 pb-3 border-b border-white/10">
        <h2 class="text-xl font-black uppercase"><i class="fas fa-trophy text-brandRed mr-2"></i> Centrum Meczowe</h2>
        <button onclick="saveMatchCenter()" class="bg-brandRed hover:bg-brandRedDark text-white text-xs font-bold px-4 py-2 rounded-xl transition">
          Zapisz Wynik
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Gospodarz</label>
          <input type="text" id="mc-home" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Tag Meczu</label>
          <input type="text" id="mc-tag" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Gość</label>
          <input type="text" id="mc-away" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Gole Gospodarza</label>
          <input type="number" id="mc-score-home" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Status Meczu</label>
          <input type="text" id="mc-status" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Gole Gościa</label>
          <input type="number" id="mc-score-away" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-400 mb-1">Strzelcy Gospodarza (po przecinku)</label>
          <input type="text" id="mc-home-scorers" placeholder="Kowalski 14', Szymański 45'" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Data / Godzina</label>
          <input type="text" id="mc-date" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>

        <div class="md:col-span-3">
          <label class="block text-xs font-bold text-slate-400 mb-1">Strzelcy Gościa (po przecinku)</label>
          <input type="text" id="mc-away-scorers" placeholder="Nowak 60'" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
      </div>
    </section>

    <!-- ZARZĄDZANIE ARTYKUŁAMI -->
    <section class="glass-panel rounded-3xl p-6 border border-red-500/20">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
        <h2 class="text-xl font-black uppercase"><i class="fas fa-newspaper text-brandRed mr-2"></i> Aktualności</h2>
      </div>

      <form onsubmit="addArticle(event)" class="space-y-3 mb-6 bg-black/30 p-4 rounded-2xl border border-white/5">
        <input type="text" id="art-title" placeholder="Tytuł artykułu" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="art-category" placeholder="Kategoria (np. Raport)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
          <input type="text" id="art-date" placeholder="Data (np. 18 Sierpnia 2026)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <textarea id="art-content" placeholder="Treść artykułu..." rows="3" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none custom-scrollbar"></textarea>
        <button type="submit" class="w-full bg-brandRed hover:bg-brandRedDark text-white text-xs font-bold py-2 rounded-xl transition">Dodaj Artykuł</button>
      </form>

      <div id="articles-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- ZARZĄDZANIE KADRĄ -->
    <section class="glass-panel rounded-3xl p-6 border border-red-500/20">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
        <h2 class="text-xl font-black uppercase"><i class="fas fa-users text-brandRed mr-2"></i> Kadra Zespołu</h2>
      </div>

      <form onsubmit="addSquadMember(event)" class="space-y-3 mb-6 bg-black/30 p-4 rounded-2xl border border-white/5">
        <div class="grid grid-cols-3 gap-2">
          <input type="number" id="sq-num" placeholder="Nr" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
          <input type="text" id="sq-name" placeholder="Imię i Nazwisko" required class="col-span-2 w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="sq-pos" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none text-slate-300">
            <option value="" disabled selected>Wybierz pozycję / rolę</option>
            <option value="I Trener">I Trener</option>
            <option value="II Trener">II Trener</option>
            <option value="Trener Bramkarzy">Trener Bramkarzy</option>
            <option value="Bramkarz">Bramkarz</option>
            <option value="Lewy Obrońca">Lewy Obrońca</option>
            <option value="Środkowy Obrońca">Środkowy Obrońca</option>
            <option value="Prawy Obrońca">Prawy Obrońca</option>
            <option value="Lewy Pomocnik">Lewy Pomocnik</option>
            <option value="Środkowy Pomocnik">Środkowy Pomocnik</option>
            <option value="Prawy Pomocnik">Prawy Pomocnik</option>
            <option value="Napastnik">Napastnik</option>
          </select>
          <input type="number" id="sq-m" placeholder="Liczba meczów" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="sq-stat" placeholder="Statystyka (np. Bramki: 5)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
          <select id="sq-icon" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none text-slate-300">
            <option value="fa-running">Ikona: Bieganie</option>
            <option value="fa-futbol">Ikona: Piłka</option>
            <option value="fa-shield-alt">Ikona: Tarcza</option>
            <option value="fa-mitten">Ikona: Rękawica</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-brandRed hover:bg-brandRedDark text-white text-xs font-bold py-2 rounded-xl transition">Dodaj Zawodnika / Trenera</button>
      </form>

      <div id="squad-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- ZARZĄDZANIE TABELĄ -->
    <section class="glass-panel rounded-3xl p-6 border border-red-500/20">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
        <h2 class="text-xl font-black uppercase"><i class="fas fa-list-ol text-brandRed mr-2"></i> Tabela Ligowa</h2>
      </div>

      <form onsubmit="addTableTeam(event)" class="space-y-3 mb-6 bg-black/30 p-4 rounded-2xl border border-white/5">
        <input type="text" id="tb-name" placeholder="Nazwa Klubu" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        <div class="grid grid-cols-4 gap-2">
          <input type="number" id="tb-m" placeholder="Mecze" required class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-2 text-sm focus:border-brandRed outline-none">
          <input type="number" id="tb-gf" placeholder="B. Zdobyte" required class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-2 text-sm focus:border-brandRed outline-none">
          <input type="number" id="tb-ga" placeholder="B. Stracone" required class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-2 text-sm focus:border-brandRed outline-none">
          <input type="number" id="tb-pkt" placeholder="Punkty" required class="w-full bg-black/50 border border-white/10 rounded-xl px-2 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="tb-isUser" class="accent-brandRed rounded h-4 w-4">
          <label for="tb-isUser" class="text-xs text-slate-300">Wyróżnij jako Super Strikers</label>
        </div>
        <button type="submit" class="w-full bg-brandRed hover:bg-brandRedDark text-white text-xs font-bold py-2 rounded-xl transition">Dodaj / Zaktualizuj Drużynę</button>
      </form>

      <div id="table-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

    <!-- ZARZĄDZANIE TERMINARZEM -->
    <section class="glass-panel rounded-3xl p-6 border border-red-500/20">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
        <h2 class="text-xl font-black uppercase"><i class="fas fa-calendar-alt text-brandRed mr-2"></i> Terminarz</h2>
      </div>

      <form onsubmit="addFixture(event)" class="space-y-3 mb-6 bg-black/30 p-4 rounded-2xl border border-white/5">
        <input type="text" id="fx-teams" placeholder="Mecz (np. Super Strikers vs Inter)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="fx-day" placeholder="Dzień (np. SOB)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
          <input type="text" id="fx-date" placeholder="Dzień miesiąca (np. 24)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="fx-info" placeholder="Szczegóły (np. 17:30 • Dom)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
          <input type="text" id="fx-round" placeholder="Runda (np. Kolejka 6)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-brandRed outline-none">
        </div>
        <button type="submit" class="w-full bg-brandRed hover:bg-brandRedDark text-white text-xs font-bold py-2 rounded-xl transition">Dodaj Mecz</button>
      </form>

      <div id="fixtures-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1"></div>
    </section>

  </main>

  <script>
    // Domyślne Dane
    const defaultArticles = [
      { id: 1, title: "Pewne zwycięstwo w meczu domowym!", date: "18 Sierpnia 2026", category: "Raport Meczowy", content: "Super Strikers pokonuje Rival FC 3:1 po kapitalnym meczu. Dominacja od pierwszej do ostatniej minuty zawalczyła o pełną pulę." },
      { id: 2, title: "Powrót na boiska w pełnej krasie", date: "15 Sierpnia 2026", category: "Klub", content: "Po przerwie technologicznej i organizacyjnej wracamy do regularnych rozgrywek. Zobacz nowe barwy oraz oficjalne logo." },
      { id: 3, title: "Mierzymy wysoko w tym sezonie", date: "10 Sierpnia 2026", category: "Wywiad", content: "Rozmowa z kapitanem zespołu na temat przygotowań, celów ligowych oraz atmosfery w czerwono-czarnej szatni." }
    ];

    const defaultMatchCenter = {
      home: "SUPER STRIKERS", away: "RIVAL FC",
      scoreHome: 3, scoreAway: 1, tag: "MECZ TOWARZYSKI",
      date: "Sobota, 18:00", status: "Koniec Meczu",
      homeScorers: ["Kowalski 14'", "Szymański 45'"], awayScorers: ["Nowak 60'"]
    };

    const defaultTable = [
      { id: 1, name: "SUPER STRIKERS BIAŁYSTOK", m: 5, gf: 14, ga: 4, pkt: 13, isUser: true },
      { id: 2, name: "Rival FC", m: 5, gf: 10, ga: 6, pkt: 10, isUser: false },
      { id: 3, name: "Inter Białystok", m: 5, gf: 8, ga: 9, pkt: 7, isUser: false }
    ];

    const defaultSquad = [
      { id: 1, num: 1, name: "Marek Kowal", pos: "Bramkarz", m: 12, stat: "Czyste konta: 5", icon: "fa-mitten" },
      { id: 2, num: 4, name: "Piotr Adamski", pos: "Środkowy Obrońca", m: 15, stat: "Bramki: 1", icon: "fa-shield-alt" },
      { id: 3, num: 8, name: "Kamil Szymański", pos: "Środkowy Pomocnik", m: 18, stat: "Asysty: 9", icon: "fa-running" },
      { id: 4, num: 9, name: "Tomasz Kowalski", pos: "Napastnik", m: 14, stat: "Bramki: 11", icon: "fa-futbol" },
      { id: 5, num: 10, name: "Michał Nowak", pos: "Lewy Pomocnik", m: 10, stat: "Asysty: 4", icon: "fa-running" }
    ];

    const defaultFixtures = [
      { id: 1, teams: "Super Strikers vs Inter Białystok", day: "SOB", date: "24", info: "17:30 • Stadion Miejski", round: "Kolejka 6" },
      { id: 2, teams: "Eagle FC vs Super Strikers", day: "NIE", date: "01", info: "16:00 • Wyjazd", round: "Kolejka 7" }
    ];

    let articles, matchCenter, tableData, squad, fixtures;

    function initData() {
      articles = JSON.parse(localStorage.getItem('articles')) || defaultArticles;
      matchCenter = JSON.parse(localStorage.getItem('matchCenter')) || defaultMatchCenter;
      tableData = JSON.parse(localStorage.getItem('tableData')) || defaultTable;
      squad = JSON.parse(localStorage.getItem('squad')) || defaultSquad;
      fixtures = JSON.parse(localStorage.getItem('fixtures')) || defaultFixtures;

      renderAllLists();
      fillMatchCenterInputs();
    }

    function renderAllLists() {
      renderArticlesList();
      renderSquadList();
      renderTableList();
      renderFixturesList();
    }

    // CENTRUM MECZOWE
    function fillMatchCenterInputs() {
      document.getElementById('mc-home').value = matchCenter.home;
      document.getElementById('mc-away').value = matchCenter.away;
      document.getElementById('mc-score-home').value = matchCenter.scoreHome;
      document.getElementById('mc-score-away').value = matchCenter.scoreAway;
      document.getElementById('mc-tag').value = matchCenter.tag;
      document.getElementById('mc-date').value = matchCenter.date;
      document.getElementById('mc-status').value = matchCenter.status;
      document.getElementById('mc-home-scorers').value = (matchCenter.homeScorers || []).join(', ');
      document.getElementById('mc-away-scorers').value = (matchCenter.awayScorers || []).join(', ');
    }

    function saveMatchCenter() {
      matchCenter = {
        home: document.getElementById('mc-home').value,
        away: document.getElementById('mc-away').value,
        scoreHome: parseInt(document.getElementById('mc-score-home').value) || 0,
        scoreAway: parseInt(document.getElementById('mc-score-away').value) || 0,
        tag: document.getElementById('mc-tag').value,
        date: document.getElementById('mc-date').value,
        status: document.getElementById('mc-status').value,
        homeScorers: document.getElementById('mc-home-scorers').value.split(',').map(s => s.trim()).filter(s => s),
        awayScorers: document.getElementById('mc-away-scorers').value.split(',').map(s => s.trim()).filter(s => s)
      };
      localStorage.setItem('matchCenter', JSON.stringify(matchCenter));
      alert('Zapisano dane centrum meczowego!');
    }

    // ARTYKUŁY
    function renderArticlesList() {
      const container = document.getElementById('articles-list');
      container.innerHTML = articles.map(art => `
        <div class="flex items-center justify-between p-2.5 bg-black/40 rounded-xl border border-white/5 text-xs">
          <div class="truncate mr-2">
            <span class="font-bold text-white">${art.title}</span>
            <span class="text-slate-500 block text-[10px]">${art.date} • ${art.category}</span>
          </div>
          <button onclick="deleteArticle(${art.id})" class="text-red-400 hover:text-red-300 p-1"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function addArticle(e) {
      e.preventDefault();
      const newArt = {
        id: Date.now(),
        title: document.getElementById('art-title').value,
        category: document.getElementById('art-category').value,
        date: document.getElementById('art-date').value,
        content: document.getElementById('art-content').value
      };
      articles.unshift(newArt);
      localStorage.setItem('articles', JSON.stringify(articles));
      renderArticlesList();
      e.target.reset();
    }

    function deleteArticle(id) {
      articles = articles.filter(a => a.id !== id);
      localStorage.setItem('articles', JSON.stringify(articles));
      renderArticlesList();
    }

    // KADRA
    function renderSquadList() {
      const container = document.getElementById('squad-list');
      container.innerHTML = squad.map(p => `
        <div class="flex items-center justify-between p-2.5 bg-black/40 rounded-xl border border-white/5 text-xs">
          <div class="truncate mr-2">
            <span class="font-bold text-white">#${p.num} ${p.name}</span>
            <span class="text-slate-500 block text-[10px]">${p.pos} • Mecze: ${p.m}</span>
          </div>
          <button onclick="deleteSquadMember(${p.id})" class="text-red-400 hover:text-red-300 p-1"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function addSquadMember(e) {
      e.preventDefault();
      const newPlayer = {
        id: Date.now(),
        num: parseInt(document.getElementById('sq-num').value),
        name: document.getElementById('sq-name').value,
        pos: document.getElementById('sq-pos').value,
        m: parseInt(document.getElementById('sq-m').value),
        stat: document.getElementById('sq-stat').value,
        icon: document.getElementById('sq-icon').value
      };
      squad.push(newPlayer);
      localStorage.setItem('squad', JSON.stringify(squad));
      renderSquadList();
      e.target.reset();
    }

    function deleteSquadMember(id) {
      squad = squad.filter(p => p.id !== id);
      localStorage.setItem('squad', JSON.stringify(squad));
      renderSquadList();
    }

    // TABELA
    function renderTableList() {
      const container = document.getElementById('table-list');
      container.innerHTML = tableData.map(t => `
        <div class="flex items-center justify-between p-2.5 bg-black/40 rounded-xl border border-white/5 text-xs">
          <div class="truncate mr-2">
            <span class="font-bold ${t.isUser ? 'text-brandRed' : 'text-white'}">${t.name}</span>
            <span class="text-slate-500 block text-[10px]">Pkt: ${t.pkt} | M: ${t.m} | B: ${t.gf}:${t.ga}</span>
          </div>
          <button onclick="deleteTableTeam(${t.id})" class="text-red-400 hover:text-red-300 p-1"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function addTableTeam(e) {
      e.preventDefault();
      const newTeam = {
        id: Date.now(),
        name: document.getElementById('tb-name').value,
        m: parseInt(document.getElementById('tb-m').value),
        gf: parseInt(document.getElementById('tb-gf').value),
        ga: parseInt(document.getElementById('tb-ga').value),
        pkt: parseInt(document.getElementById('tb-pkt').value),
        isUser: document.getElementById('tb-isUser').checked
      };
      tableData.push(newTeam);
      localStorage.setItem('tableData', JSON.stringify(tableData));
      renderTableList();
      e.target.reset();
    }

    function deleteTableTeam(id) {
      tableData = tableData.filter(t => t.id !== id);
      localStorage.setItem('tableData', JSON.stringify(tableData));
      renderTableList();
    }

    // TERMINARZ
    function renderFixturesList() {
      const container = document.getElementById('fixtures-list');
      container.innerHTML = fixtures.map(f => `
        <div class="flex items-center justify-between p-2.5 bg-black/40 rounded-xl border border-white/5 text-xs">
          <div class="truncate mr-2">
            <span class="font-bold text-white">${f.teams}</span>
            <span class="text-slate-500 block text-[10px]">${f.day} ${f.date} • ${f.info}</span>
          </div>
          <button onclick="deleteFixture(${f.id})" class="text-red-400 hover:text-red-300 p-1"><i class="fas fa-trash"></i></button>
        </div>
      `).join('');
    }

    function addFixture(e) {
      e.preventDefault();
      const newFix = {
        id: Date.now(),
        teams: document.getElementById('fx-teams').value,
        day: document.getElementById('fx-day').value,
        date: document.getElementById('fx-date').value,
        info: document.getElementById('fx-info').value,
        round: document.getElementById('fx-round').value
      };
      fixtures.push(newFix);
      localStorage.setItem('fixtures', JSON.stringify(fixtures));
      renderFixturesList();
      e.target.reset();
    }

    function deleteFixture(id) {
      fixtures = fixtures.filter(f => f.id !== id);
      localStorage.setItem('fixtures', JSON.stringify(fixtures));
      renderFixturesList();
    }

    window.onload = initData;
  </script>
</body>
</html>
